<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Internet</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1a237e;
      color: white;
    }
    .container {
      max-width: 400px;
      margin: auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 22px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
    }
    button {
      background: #3949ab;
      color: white;
      cursor: pointer;
    }
    .box {
      background: rgba(255,255,255,0.1);
      padding: 15px;
      margin-top: 15px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gestor de Internet</h1><div class="box">
  <input id="user" placeholder="Nombre o código" />
  <button onclick="login()">Entrar</button>
</div>

<div class="box" id="panel" style="display:none;">
  <p id="estado"></p>
  <p><strong>Contraseña:</strong></p>
  <p id="clave"></p>
</div>

  </div>  <script>
    const DATA = {
      admin: "admin123",
      wifi: "CLAVE-WIFI-001",
      clientes: {
        dylan: { activo: true },
        prueba: { activo: false }
      }
    };

    localStorage.setItem('data', JSON.stringify(DATA));

    function login() {
      const user = document.getElementById('user').value;
      const data = JSON.parse(localStorage.getItem('data'));
      const panel = document.getElementById('panel');
      const estado = document.getElementById('estado');
      const clave = document.getElementById('clave');

      if (data.clientes[user]?.activo) {
        estado.textContent = 'Acceso activo';
        clave.textContent = data.wifi;
        panel.style.display = 'block';
      } else {
        estado.textContent = 'Acceso vencido o inexistente';
        clave.textContent = '';
        panel.style.display = 'block';
      }
    }
  </script></body>
</html>
