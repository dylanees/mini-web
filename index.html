<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi web privada</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Publicaciones privadas</h1>
  <!-- Mini descripción: escribe tu texto entre las etiquetas <p>. Si lo dejas vacío, solo queda el espacio. -->
  <p class="subtitulo"></p>

  <!-- ---------- Pantalla de login ---------- -->
  <form id="login" class="login-box">
    <input type="email" id="email" placeholder="Correo" required autocomplete="username">
    <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
    <button type="submit" class="btn">Entrar</button>
    <p class="error" id="error"></p>
  </form>

  <!-- ---------- Contenido privado (solo con sesión) ---------- -->
  <div id="contenido" class="oculto">
    <button class="btn-salir" id="salir" title="Cerrar sesión" aria-label="Cerrar sesión">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
        <line x1="12" y1="2" x2="12" y2="12"/>
      </svg>
    </button>

    <div class="boton-container">
      <a class="btn" href="https://youtu.be/dQw4w9WgXcQ" target="_blank" rel="noopener">Recompensas gratis</a>
    </div>

    <div class="buscador">
      <input type="search" id="buscar" placeholder="🔍 Buscar publicaciones..." autocomplete="off">
    </div>

    <div class="boton-container">
      <button class="btn" id="abajo">⬇ Ir abajo</button>
    </div>

    <div class="galeria-container" id="galeria"></div>
    <p class="sin-resultados oculto" id="sinResultados">No hay publicaciones que coincidan.</p>

    <div class="boton-container" id="fin">
      <button class="btn" id="arriba">⬆ Volver arriba</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 1) Pega aquí los datos de tu proyecto de Supabase
    //    (Project Settings > API). La "anon key" es pública por diseño.
    const SUPABASE_URL = "https://dooelbevpyvebqrkbtpf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_lKZ3vcE5TmFpBSEfwd0ysA_t8ryRKRW";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginForm = document.getElementById("login");
    const contenido = document.getElementById("contenido");
    const galeria = document.getElementById("galeria");
    const errorEl = document.getElementById("error");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      });
      if (error) errorEl.textContent = "Correo o contraseña incorrectos";
    });

    document.getElementById("salir").addEventListener("click", () => db.auth.signOut());

    async function cargarPublicaciones() {
      const { data, error } = await db
        .from("publicaciones")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        galeria.textContent = "No se pudieron cargar las publicaciones.";
        return;
      }

      const tarjetas = [];
      data.forEach((p) => {
        const card = document.createElement("div");
        card.className = "imagen-card";

        if (p.imagen_url) {
          const img = document.createElement("img");
          img.src = p.imagen_url;
          img.alt = p.titulo;
          card.appendChild(img);
        }

        const h3 = document.createElement("h3");
        h3.textContent = p.titulo;
        const txt = document.createElement("p");
        txt.textContent = p.descripcion || "";

        card.append(h3, txt);
        tarjetas.push(card);
      });
      // Reemplaza todo de una vez: si la carga corre dos veces, no se duplica
      galeria.replaceChildren(...tarjetas);
      filtrar();
    }

    // Quita mayúsculas y acentos para que "camion" encuentre "Camión"
    const limpiar = (t) =>
      t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

    const buscar = document.getElementById("buscar");
    const sinResultados = document.getElementById("sinResultados");

    function filtrar() {
      const q = limpiar(buscar.value.trim());
      let visibles = 0;
      for (const card of galeria.children) {
        const coincide = limpiar(card.textContent).includes(q);
        card.classList.toggle("oculto", !coincide);
        if (coincide) visibles++;
      }
      sinResultados.classList.toggle("oculto", visibles > 0 || galeria.children.length === 0);
    }

    buscar.addEventListener("input", filtrar);

    // Botones para desplazarse
    document.getElementById("abajo").addEventListener("click", () =>
      document.getElementById("fin").scrollIntoView({ behavior: "smooth" }));
    document.getElementById("arriba").addEventListener("click", () =>
      window.scrollTo({ top: 0, behavior: "smooth" }));

    // Muestra u oculta todo según haya sesión o no
    function actualizarPantalla(session) {
      if (session) {
        loginForm.classList.add("oculto");
        contenido.classList.remove("oculto");
        cargarPublicaciones();
      } else {
        loginForm.classList.remove("oculto");
        contenido.classList.add("oculto");
        galeria.textContent = "";
        buscar.value = "";
      }
    }

    db.auth.onAuthStateChange((_evento, session) => actualizarPantalla(session));
  </script>

</body>
</html>
