<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi web privada</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🖼️ Galería privada</h1>
  <p class="subtitulo" id="subtitulo">Inicia sesión para ver las publicaciones</p>

  <!-- ---------- Pantalla de login ---------- -->
  <form id="login" class="login-box">
    <input type="email" id="email" placeholder="Correo" required autocomplete="username">
    <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
    <button type="submit" class="btn">Entrar</button>
    <p class="error" id="error"></p>
  </form>

  <!-- ---------- Contenido privado (solo con sesión) ---------- -->
  <div id="contenido" class="oculto">
    <div class="boton-container">
      <button class="btn" id="salir">Cerrar sesión</button>
    </div>
    <div class="galeria-container" id="galeria"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 1) Pega aquí los datos de tu proyecto de Supabase
    //    (Project Settings > API). La "anon key" es pública por diseño.
    const SUPABASE_URL = "PEGA_AQUI_TU_URL";
    const SUPABASE_KEY = "PEGA_AQUI_TU_ANON_KEY";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginForm = document.getElementById("login");
    const contenido = document.getElementById("contenido");
    const galeria = document.getElementById("galeria");
    const errorEl = document.getElementById("error");
    const subtitulo = document.getElementById("subtitulo");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      });
      if (error) errorEl.textContent = "Correo o contraseña incorrectos";
    });

    document.getElementById("salir").addEventListener("click", () => db.auth.signOut());

    async function cargarPublicaciones() {
      galeria.textContent = "";
      const { data, error } = await db
        .from("publicaciones")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        galeria.textContent = "No se pudieron cargar las publicaciones.";
        return;
      }

      data.forEach((p) => {
        const card = document.createElement("div");
        card.className = "imagen-card";

        if (p.imagen_url) {
          const img = document.createElement("img");
          img.src = p.imagen_url;
          img.alt = p.titulo;
          card.appendChild(img);
        }

        const h3 = document.createElement("h3");
        h3.textContent = p.titulo;
        const txt = document.createElement("p");
        txt.textContent = p.descripcion || "";

        card.append(h3, txt);
        galeria.appendChild(card);
      });
    }

    // Muestra u oculta todo según haya sesión o no
    function actualizarPantalla(session) {
      if (session) {
        loginForm.classList.add("oculto");
        contenido.classList.remove("oculto");
        subtitulo.textContent = "Publicaciones";
        cargarPublicaciones();
      } else {
        loginForm.classList.remove("oculto");
        contenido.classList.add("oculto");
        galeria.textContent = "";
        subtitulo.textContent = "Inicia sesión para ver las publicaciones";
      }
    }

    db.auth.onAuthStateChange((_evento, session) => actualizarPantalla(session));
  </script>

</body>
</html>
